apiVersion: v1
kind: Secret
metadata:
  name: bh-core-secret
type: Opaque
stringData:
  # IMPORTANT: do not store real credentials in this file. Use a secrets manager, environment variables, or sealed secrets.
  DB_PASSWORD: "${DB_PASSWORD}"
  JWT_SECRET: "${JWT_SECRET}"
  MAIL_USER: "${MAIL_USER}"
  MAIL_PASS: "${MAIL_PASS}"
  MAIL_FROM: "${MAIL_FROM}"
