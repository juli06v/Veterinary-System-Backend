apiVersion: apps/v1
kind: Deployment
metadata:
  name: bh-core-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bh-core-app
  template:
    metadata:
      labels:
        app: bh-core-app
    spec:
      containers:
        - name: bh-core
          image: bh-core:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          envFrom:
            - configMapRef:
                name: bh-core-config
            - secretRef:
                name: bh-core-secret
