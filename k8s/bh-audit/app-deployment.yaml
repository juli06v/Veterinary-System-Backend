apiVersion: apps/v1
kind: Deployment
metadata:
  name: bh-audit-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bh-audit-app
  template:
    metadata:
      labels:
        app: bh-audit-app
    spec:
      containers:
        - name: bh-audit
          image: bh-audit:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          envFrom:
            - configMapRef:
                name: bh-audit-config
            - secretRef:
                name: bh-audit-secret
